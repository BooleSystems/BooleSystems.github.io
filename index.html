<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BooleSystems</title>
<meta name="description" content="BooleSystems — coming soon...">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    color: #c9d1d9;
    font-family: 'DejaVu Sans Mono', 'Liberation Mono', monospace;
    background-color: #0d1117;
    background-image:
      radial-gradient(ellipse 60% 50% at 25% 30%, rgba(88, 166, 255, 0.28), transparent 70%),
      radial-gradient(ellipse 60% 50% at 75% 70%, rgba(163, 113, 247, 0.26), transparent 70%);
    background-attachment: fixed;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  h1 {
    font-weight: 700;
    font-size: clamp(1.75rem, 8vw, 4.5rem);
    letter-spacing: -0.02em;
    color: #e6edf3;
    text-shadow: 0 0 24px rgba(88, 166, 255, 0.45);
    overflow-wrap: anywhere;
  }

  footer {
    font-size: 0.8rem;
    color: #8b949e;
    text-align: center;
  }

  footer a {
    color: #58a6ff;
    text-decoration: none;
  }

  footer a:hover, footer a:focus { text-decoration: underline; }
</style>
</head>
<body>
  <main>
    <h1>coming soon...</h1>
  </main>
  <footer>
    BooleSystems &middot;
    <a href="https://github.com/BooleSystems/BooleOS">github.com/BooleSystems/BooleOS</a>
